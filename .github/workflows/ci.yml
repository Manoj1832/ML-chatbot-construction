name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify no secrets in build output
        run: |
          if grep -rnE "gsk_|GROQ_API_KEY" dist/; then
            echo "Secret leaked into dist/!"
            exit 1
          fi

      - name: Security audit (critical)
        run: npm audit --omit=dev --audit-level=critical
